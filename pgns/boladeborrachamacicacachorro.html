<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bola de Borracha Maçica para Cachorro</title>
</head>
<body>
    <header>
        <h1>Bola de Borracha Maçica para Cachorro</h1>
        <img src="../img/bola-de-borracha-macica-cachorro.webp" alt="Bola de Borracha Maçica para Cachorro" width="300" height="400">
    </header>

    <main>
        <h2>Detalhes do Produto:</h2>
        <ul>
            <li>Feito de borracha resistente.</li>
            <li>Ideal para cães de mordida forte.</li>
            <li>Ótimo para brincar de buscar e roer.</li>
        </ul>

        <h2>Informações para compra:</h2>

        <form action="#" method="POST">
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome." size="40" required><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="emailexemplo@gmail.com" size="40" required><br>

            <label for="cpf">CPF:</label><br>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" size="14" required><br>

            <label for="telefone">Telefone:</label><br>
            <input type="tel" id="telefone" name="telefone" placeholder="(00) 90000-0000" maxlength="15" size="15" required><br>

            <label for="endereco">Endereço:</label><br>
            <input type="text" id="endereco" name="endereco" placeholder="Digite seu endereço." size="50" required><br><br>

            <button type="reset">Limpar Formulário</button>
            <button type="submit">Enviar Dados</button>
        </form>
    </main>

    <footer>
        <a href="../index.html">Retornar para a página principal</a>
    </footer>
</body>
</html>
