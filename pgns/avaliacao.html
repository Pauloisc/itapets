<!DOCTYPE html>
<html lang="pt-br">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <meta content="Deixe sua avaliação e comentários sobre a ItaPets." name="description"/>
  <link href="../assets/img/logo.webp" rel="icon" type="image/webp"/>
  <title>
   Avaliação e Comentários
  </title>
  <link href="../styles/main.css" rel="stylesheet"/>
 </head>
 <body class="body">
  <header>
   <h1 class="titulo">
    Avaliação e Comentários
   </h1>
   <p>
    Deixe sua opinião sobre o nosso site!
   </p>
  </header>
  <main>
   <form action="mailto:pauloitalo061@gmail.com" enctype="text/plain" method="POST">
    <fieldset>
     <legend>
      Seus Dados e Comentários
     </legend>
     <label for="nome">
      Nome:
     </label>
     <br/>
     <input id="nome" name="nome" placeholder="Digite seu nome." required="" size="40" type="text"/>
     <br/>
     <br/>
     <label for="email">
      Email:
     </label>
     <br/>
     <input id="email" name="email" placeholder="emailexemplo@gmail.com" required="" size="40" type="email"/>
     <br/>
     <br/>
     <label for="telefone">
      Telefone:
     </label>
     <br/>
     <input id="telefone" maxlength="15" name="telefone" placeholder="(00) 90000-0000" required="" size="15" type="tel"/>
     <br/>
     <br/>
     <label for="comentarios">
      Comentários:
     </label>
     <br/>
     <textarea cols="42" id="comentarios" name="comentarios" placeholder="Deixe aqui o seu comentário ou avaliação sobre o nosso site." required="" rows="5"></textarea>
     <br/>
     <br/>
     <button type="reset">
      Limpar Formulário
     </button>
     <button type="submit">
      Enviar Avaliação
     </button>
    </fieldset>
   </form>
  </main>
 </body>
</html>
